<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#F9F7EF" />
      <stop offset="100%" stopColor="#E5ECD9" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#2E231F" />
      <stop offset="100%" stopColor="#1B1311" />
    </linearGradient>
    <linearGradient id="jacketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#748560" />
      <stop offset="100%" stopColor="#556444" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#FAD3B2" />
      <stop offset="100%" stopColor="#EEBC94" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" floodColor="#2A381E" floodOpacity="0.18" />
    </filter>
  </defs>

  {/* Outer Circle Background */}
  <circle cx="200" cy="200" r="190" fill="url(#bgGrad)" stroke="#4A563A" stroke-width="6" />
  
  {/* Decorative Retro Grid Accent */}
  <circle cx="200" cy="200" r="172" fill="none" stroke="#748560" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.6" />

  {/* Floating Sparkles & Code Elements */}
  <g fill="#D96B27" opacity="0.85">
    {/* Sparkle top left */}
    <path d="M 70 80 Q 70 95 55 95 Q 70 95 70 110 Q 70 95 85 95 Q 70 95 70 80 Z" />
    {/* Small star top right */}
    <path d="M 330 90 Q 330 100 320 100 Q 330 100 330 110 Q 330 100 340 100 Q 330 100 330 90 Z" />
    {/* Yellow star right */}
    <circle cx="340" cy="180" r="4" fill="#FDE769" />
    <circle cx="65" cy="190" r="3" fill="#748560" />
  </g>

  {/* Code Tag Badge <dev> */}
  <g transform="translate(45, 230)">
    <rect x="0" y="0" width="55" height="26" rx="13" fill="#FFFFFF" stroke="#4A563A" stroke-width="2" />
    <text x="27" y="17" fill="#D96B27" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">&lt;/&gt;</text>
  </g>

  {/* AI Sparkle Badge AI */}
  <g transform="translate(300, 230)">
    <rect x="0" y="0" width="55" height="26" rx="13" fill="#FFFFFF" stroke="#4A563A" stroke-width="2" />
    <text x="27" y="17" fill="#748560" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">AI ✨</text>
  </g>

  {/* Developer Character */}
  <g filter="url(#softShadow)">
    {/* Back Hair */}
    <path d="M 125 180 C 110 240 115 310 135 340 C 150 340 160 330 160 300 C 160 270 150 210 150 180 Z" fill="url(#hairGrad)" />
    <path d="M 275 180 C 290 240 285 310 265 340 C 250 340 240 330 240 300 C 240 270 250 210 250 180 Z" fill="url(#hairGrad)" />

    {/* Shoulders / Torso / Sage Jacket */}
    <path d="M 115 385 C 115 330 145 285 200 285 C 255 285 285 330 285 385 Z" fill="url(#jacketGrad)" stroke="#4A563A" stroke-width="4" />
    
    {/* Shirt Collar / Terracotta Accent */}
    <path d="M 185 285 L 200 320 L 215 285 Z" fill="#D96B27" stroke="#4A563A" stroke-width="2" />
    <path d="M 175 285 L 200 335 L 188 385 L 165 385 Z" fill="#FAF8F0" />
    <path d="M 225 285 L 200 335 L 212 385 L 235 385 Z" fill="#FAF8F0" />

    {/* Neck */}
    <rect x="186" y="240" width="28" height="52" rx="4" fill="url(#skinGrad)" stroke="#4A563A" stroke-width="3" />

    {/* Head / Face */}
    <ellipse cx="200" cy="180" rx="65" ry="72" fill="url(#skinGrad)" stroke="#4A563A" stroke-width="4" />

    {/* Ears */}
    <circle cx="135" cy="182" r="14" fill="url(#skinGrad)" stroke="#4A563A" stroke-width="3" />
    <circle cx="265" cy="182" r="14" fill="url(#skinGrad)" stroke="#4A563A" stroke-width="3" />
    <circle cx="135" cy="182" r="7" fill="#EEBC94" />
    <circle cx="265" cy="182" r="7" fill="#EEBC94" />

    {/* Stylish Front Hair / Bangs */}
    <path d="M 135 170 C 130 115 170 85 200 85 C 230 85 270 115 265 170 C 255 130 235 120 200 120 C 165 120 145 130 135 170 Z" fill="url(#hairGrad)" stroke="#4A563A" stroke-width="3" />
    <path d="M 136 160 C 150 135 180 135 205 142 C 175 148 150 165 142 185 Z" fill="url(#hairGrad)" />
    <path d="M 264 160 C 250 135 220 135 195 142 C 225 148 250 165 258 185 Z" fill="url(#hairGrad)" />

    {/* Glasses Frame - Cute Round Retro Tortoise/Dark */}
    <g stroke="#3D291D" stroke-width="3.5" fill="none">
      <circle cx="172" cy="176" r="21" fill="#FFFFFF" fill-opacity="0.35" />
      <circle cx="228" cy="176" r="21" fill="#FFFFFF" fill-opacity="0.35" />
      <path d="M 193 175 Q 200 172 207 175" />
      <path d="M 151 174 L 138 171" />
      <path d="M 249 174 L 262 171" />
    </g>

    {/* Eyes (Friendly & Confident) */}
    <g fill="#241B18">
      <ellipse cx="172" cy="176" rx="5.5" ry="6.5" />
      <ellipse cx="228" cy="176" rx="5.5" ry="6.5" />
      {/* Eye catchlights */}
      <circle cx="170" cy="173" r="2" fill="#FFFFFF" />
      <circle cx="226" cy="173" r="2" fill="#FFFFFF" />
    </g>

    {/* Eyebrows */}
    <path d="M 158 154 Q 172 150 184 155" stroke="#241B18" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M 242 154 Q 228 150 216 155" stroke="#241B18" stroke-width="2.5" stroke-linecap="round" fill="none" />

    {/* Rosy Cheeks in Terracotta */}
    <ellipse cx="152" cy="192" rx="9" ry="5.5" fill="#D96B27" opacity="0.45" />
    <ellipse cx="248" cy="192" rx="9" ry="5.5" fill="#D96B27" opacity="0.45" />

    {/* Nose */}
    <path d="M 200 178 Q 203 186 198 188" stroke="#D3966D" stroke-width="2" stroke-linecap="round" fill="none" />

    {/* Warm Smile */}
    <path d="M 188 202 Q 200 213 212 202" stroke="#4A563A" stroke-width="3" stroke-linecap="round" fill="none" />
    
    {/* Cute Headphone / Tech Earset */}
    <path d="M 132 170 C 132 150 135 110 200 110 C 265 110 268 150 268 170" stroke="#748560" stroke-width="5" fill="none" stroke-linecap="round" />
    <rect x="127" y="165" width="10" height="26" rx="5" fill="#4A563A" />
    <rect x="263" y="165" width="10" height="26" rx="5" fill="#4A563A" />
  </g>
</svg>