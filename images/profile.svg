<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FAF8F0" />
      <stop offset="100%" stopColor="#E4ECD8" />
    </linearGradient>

    <!-- Deep warm curly hair shades -->
    <linearGradient id="hairBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#352018" />
      <stop offset="60%" stopColor="#22140E" />
      <stop offset="100%" stopColor="#150C08" />
    </linearGradient>

    <linearGradient id="hairHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#5E3827" />
      <stop offset="100%" stopColor="#3E2418" />
    </linearGradient>

    <!-- Warm glowing skin tone -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#F8CBA6" />
      <stop offset="100%" stopColor="#EAB78D" />
    </linearGradient>

    <!-- Sage green sweater palette -->
    <linearGradient id="sweaterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#7B8D67" />
      <stop offset="100%" stopColor="#576646" />
    </linearGradient>

    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" floodColor="#27331C" floodOpacity="0.22" />
    </filter>
  </defs>

  <!-- Circular Outer Frame with Theme Sage Border -->
  <circle cx="200" cy="200" r="190" fill="url(#bgGrad)" stroke="#4A563A" stroke-width="6" />

  <!-- Dotted Retro Orbit Ring -->
  <circle cx="200" cy="200" r="174" fill="none" stroke="#748560" stroke-width="2" stroke-dasharray="6,8" opacity="0.5" />

  <!-- Playful Decorative Badges & Sparkles -->
  <g fill="#D96B27">
    <!-- Star top-left -->
    <path d="M 65 75 Q 65 90 50 90 Q 65 90 65 105 Q 65 90 80 90 Q 65 90 65 75 Z" />
    <!-- Star top-right -->
    <path d="M 335 85 Q 335 98 322 98 Q 335 98 335 111 Q 335 98 348 98 Q 335 98 335 85 Z" />
    <!-- Yellow star right -->
    <circle cx="345" cy="180" r="4.5" fill="#FDE769" stroke="#4A563A" stroke-width="1" />
    <!-- Mint dot left -->
    <circle cx="58" cy="175" r="4" fill="#A6E3A1" stroke="#4A563A" stroke-width="1" />
  </g>

  <!-- Floating <code/> pill tag -->
  <g transform="translate(42, 225)">
    <rect x="0" y="0" width="58" height="28" rx="14" fill="#FAF8F0" stroke="#4A563A" stroke-width="2" />
    <text x="29" y="19" fill="#D96B27" font-family="'Fira Code', monospace" font-size="12" font-weight="bold" text-anchor="middle">&lt;/&gt;</text>
  </g>

  <!-- Floating AI ✨ pill tag -->
  <g transform="translate(300, 225)">
    <rect x="0" y="0" width="58" height="28" rx="14" fill="#FAF8F0" stroke="#4A563A" stroke-width="2" />
    <text x="29" y="18" fill="#748560" font-family="'Fira Code', monospace" font-size="11.5" font-weight="bold" text-anchor="middle">AI ✨</text>
  </g>

  <!-- ==================== CURLY HAIR: BACK VOLUMINOUS PUFFS ==================== -->
  <g filter="url(#softShadow)">
    <!-- Backdrop of deep curly clouds (behind head & neck) -->
    <g fill="url(#hairBase)">
      <!-- Left voluminous curls -->
      <circle cx="118" cy="145" r="38" />
      <circle cx="95" cy="180" r="40" />
      <circle cx="90" cy="225" r="38" />
      <circle cx="105" cy="270" r="36" />
      <circle cx="125" cy="305" r="34" />
      <circle cx="140" cy="115" r="36" />
      <circle cx="170" cy="95" r="38" />
      
      <!-- Top crown curls -->
      <circle cx="200" cy="85" r="42" />
      <circle cx="230" cy="95" r="38" />
      
      <!-- Right voluminous curls -->
      <circle cx="260" cy="115" r="36" />
      <circle cx="282" cy="145" r="38" />
      <circle cx="305" cy="180" r="40" />
      <circle cx="310" cy="225" r="38" />
      <circle cx="295" cy="270" r="36" />
      <circle cx="275" cy="305" r="34" />
    </g>

    <!-- Rich highlight curly ringlets layer -->
    <g fill="url(#hairHighlight)" opacity="0.85">
      <circle cx="125" cy="135" r="28" />
      <circle cx="105" cy="175" r="30" />
      <circle cx="100" cy="220" r="28" />
      <circle cx="115" cy="265" r="26" />
      <circle cx="175" cy="90" r="28" />
      <circle cx="200" cy="80" r="30" />
      <circle cx="225" cy="90" r="28" />
      <circle cx="275" cy="135" r="28" />
      <circle cx="295" cy="175" r="30" />
      <circle cx="300" cy="220" r="28" />
      <circle cx="285" cy="265" r="26" />
    </g>

    <!-- Torso / Shoulders in Sage Green Knit Sweater -->
    <path d="M 115 385 C 115 330 145 285 200 285 C 255 285 285 330 285 385 Z" fill="url(#sweaterGrad)" stroke="#4A563A" stroke-width="4" />
    
    <!-- Warm Terracotta Neckline Collar -->
    <path d="M 184 285 L 200 318 L 216 285 Z" fill="#D96B27" stroke="#4A563A" stroke-width="2.5" />
    <!-- White inner collared shirt peek -->
    <path d="M 172 285 L 200 332 L 188 385 L 165 385 Z" fill="#FAF8F0" />
    <path d="M 228 285 L 200 332 L 212 385 L 235 385 Z" fill="#FAF8F0" />

    <!-- Cute Retro Pendant Necklace -->
    <path d="M 188 318 Q 200 335 212 318" fill="none" stroke="#D96B27" stroke-width="2" />
    <circle cx="200" cy="336" r="4.5" fill="#FDE769" stroke="#4A563A" stroke-width="1.5" />

    <!-- Neck -->
    <rect x="185" y="240" width="30" height="52" rx="6" fill="url(#skinGrad)" stroke="#4A563A" stroke-width="3.5" />

    <!-- Cute Headphone resting on neck -->
    <path d="M 148 275 C 148 300 252 300 252 275" fill="none" stroke="#37412E" stroke-width="7" stroke-linecap="round" />
    <rect x="140" y="260" width="16" height="26" rx="7" fill="#748560" stroke="#37412E" stroke-width="2.5" />
    <rect x="244" y="260" width="16" height="26" rx="7" fill="#748560" stroke="#37412E" stroke-width="2.5" />

    <!-- Head / Face Structure -->
    <ellipse cx="200" cy="184" rx="64" ry="72" fill="url(#skinGrad)" stroke="#4A563A" stroke-width="4" />

    <!-- Ears with tiny cute gold hoop earrings -->
    <g>
      <circle cx="136" cy="186" r="13" fill="url(#skinGrad)" stroke="#4A563A" stroke-width="3" />
      <circle cx="264" cy="186" r="13" fill="url(#skinGrad)" stroke="#4A563A" stroke-width="3" />
      <circle cx="136" cy="186" r="6" fill="#EAB78D" />
      <circle cx="264" cy="186" r="6" fill="#EAB78D" />
      <!-- Gold mini hoops -->
      <circle cx="134" cy="198" r="5" fill="none" stroke="#FDE769" stroke-width="2" />
      <circle cx="266" cy="198" r="5" fill="none" stroke="#FDE769" stroke-width="2" />
    </g>

    <!-- ==================== FRONT CURLY HAIR / BANGS & TEMPLE CURLS ==================== -->
    <!-- Bouncy Curly Forehead Curls / Fringe -->
    <g fill="url(#hairBase)">
      <!-- Left front curls framing cheek -->
      <circle cx="140" cy="145" r="24" />
      <circle cx="132" cy="172" r="20" />
      <circle cx="138" cy="198" r="18" />
      
      <!-- Right front curls framing cheek -->
      <circle cx="260" cy="145" r="24" />
      <circle cx="268" cy="172" r="20" />
      <circle cx="262" cy="198" r="18" />

      <!-- Top bouncy curls / fringe clusters -->
      <circle cx="158" cy="122" r="22" />
      <circle cx="182" cy="115" r="24" />
      <circle cx="208" cy="114" r="24" />
      <circle cx="234" cy="122" r="22" />

      <!-- Cute springy forehead baby curls -->
      <circle cx="168" cy="138" r="15" />
      <circle cx="195" cy="136" r="16" />
      <circle cx="224" cy="138" r="15" />
    </g>

    <!-- Spiral / Ringlet Detail Lines inside hair -->
    <g fill="none" stroke="#5E3827" stroke-width="2.5" stroke-linecap="round">
      <!-- Crown curly swirls -->
      <path d="M 152 116 Q 164 106 172 120" />
      <path d="M 180 108 Q 194 98 204 114" />
      <path d="M 210 108 Q 224 100 230 118" />
      
      <!-- Left curly spirals -->
      <path d="M 122 140 Q 134 135 140 150" />
      <path d="M 112 175 Q 124 165 130 182" />
      <path d="M 118 215 Q 130 210 134 225" />

      <!-- Right curly spirals -->
      <path d="M 276 140 Q 266 135 260 150" />
      <path d="M 286 175 Q 274 165 268 182" />
      <path d="M 280 215 Q 268 210 264 225" />

      <!-- Cute bounce curl on forehead -->
      <path d="M 188 130 Q 198 142 205 132" stroke="#6E4230" stroke-width="3" />
    </g>

    <!-- Eyebrows (Natural & expressive) -->
    <path d="M 156 160 Q 172 153 184 158" stroke="#22140E" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M 244 160 Q 228 153 216 158" stroke="#22140E" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- Cute Round Tortoiseshell Glasses -->
    <g stroke="#3E2418" stroke-width="3.5" fill="none">
      <circle cx="172" cy="180" r="21" fill="#FFFFFF" fill-opacity="0.3" stroke="#3E2418" />
      <circle cx="228" cy="180" r="21" fill="#FFFFFF" fill-opacity="0.3" stroke="#3E2418" />
      <!-- Bridge -->
      <path d="M 193 178 Q 200 174 207 178" />
      <!-- Temples -->
      <path d="M 151 178 L 138 174" />
      <path d="M 249 178 L 262 174" />
    </g>

    <!-- Warm, Sparkling Eyes -->
    <g fill="#180F0B">
      <ellipse cx="172" cy="180" rx="5.5" ry="6.5" />
      <ellipse cx="228" cy="180" rx="5.5" ry="6.5" />
      <!-- Catchlights -->
      <circle cx="170" cy="177" r="2.2" fill="#FFFFFF" />
      <circle cx="226" cy="177" r="2.2" fill="#FFFFFF" />
      <circle cx="174" cy="183" r="1.1" fill="#FFFFFF" />
      <circle cx="230" cy="183" r="1.1" fill="#FFFFFF" />
    </g>

    <!-- Subtle Eyelash Flicks -->
    <path d="M 178 174 Q 183 172 186 175" stroke="#180F0B" stroke-width="1.8" fill="none" stroke-linecap="round" />
    <path d="M 222 174 Q 217 172 214 175" stroke="#180F0B" stroke-width="1.8" fill="none" stroke-linecap="round" />

    <!-- Rosy Terracotta Cheeks -->
    <ellipse cx="152" cy="196" rx="9.5" ry="6" fill="#D96B27" opacity="0.45" />
    <ellipse cx="248" cy="196" rx="9.5" ry="6" fill="#D96B27" opacity="0.45" />

    <!-- Cute Button Nose -->
    <path d="M 200 182 Q 203 190 197 192" stroke="#C98B60" stroke-width="2.2" stroke-linecap="round" fill="none" />

    <!-- Warm Joyful Smile -->
    <path d="M 188 206 Q 200 218 212 206" stroke="#4A563A" stroke-width="3.2" stroke-linecap="round" fill="none" />
  </g>
</svg>